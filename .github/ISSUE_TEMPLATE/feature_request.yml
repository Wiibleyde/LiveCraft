name: Feature request
description: Something you need for your shows
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the situation in your show rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - Yes
        - With some help
        - No
