name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you. Please remove stream keys, passphrases and passwords from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Add a video input\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Your setup
      description: Windows version, processor, graphics card, FFmpeg version, and any cameras or cards involved.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, or what the status bar and the Statistics window showed.
