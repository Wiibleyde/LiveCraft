name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        # ALSA headers for sound; DejaVu for the font test; a keyring so that
        # sealing secrets goes through the Secret Service as on a desktop.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config fonts-dejavu-core dbus gnome-keyring libsecret-tools
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test
      - name: Test, with an unlocked keyring
        if: runner.os == 'Linux'
        # The last command fails if the sealing key went anywhere but the keyring.
        run: >-
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
          && cargo test
          && secret-tool search application livecraft purpose session-key 2> /dev/null | grep -q "^label = LiveCraft"'
