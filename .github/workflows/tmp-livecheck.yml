# TEMPORARY (#40): the live check many times in one run, to catch the RTMP sound flake.
name: tmp livecheck

on:
  push:
    branches: [fix/livecheck-rtmp-sound]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  livecheck:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: livecheck-${{ hashFiles('Cargo.lock') }}
          restore-keys: livecheck-
      - name: Install FFmpeg
        run: |
          # A dated BtbN release, and the SHA-256 that release publishes in its checksums.sha256.
          $release = 'autobuild-2026-11-09-12-42'
          $name = 'ffmpeg-n9.0.2-48-gd4070a14ce-win64-gpl-shared-9.0.zip'
          $sha256 = '391c241f4c940dd4cdc082282a2ea54b1b2673d1c14246517fda6d55403c2d11'
          $zip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/$name" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($got -ne $sha256) { throw "FFmpeg zip has SHA-256 $got, expected $sha256" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe).DirectoryName | Out-File -Append $env:GITHUB_PATH
      - name: Install the VB-CABLE virtual microphone
        timeout-minutes: 5
        run: |
          # Server images keep the sound service off and have no sound device.
          Set-Service audiosrv -StartupType Automatic
          Start-Service audiosrv
          $dir = "$env:RUNNER_TEMP/vbcable"
          # VB-Audio publishes no checksum: both values below were taken from the download of
          # 2026-11-12 (pinned at first use) and any difference fails the job.
          $sha256 = 'b950e39f01af1d04ea623c8f6d8eb9b6ea5c477c637295fabf20631c85116bfb'
          $thumbprint = '9A4A6CFEE73C6B65945FCAA083DFBCC1E9077E7E'  # the driver catalog's signer
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip -OutFile "$dir.zip"
          $got = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash
          if ($got -ne $sha256) { throw "VB-CABLE zip has SHA-256 $got, expected $sha256" }
          Expand-Archive "$dir.zip" -DestinationPath $dir
          # Trusting the driver's publisher lets it install without a prompt, but only this exact certificate.
          $sig = Get-AuthenticodeSignature "$dir/vbaudio_cable64_win10.cat"
          if ($sig.Status -ne 'Valid') { throw "VB-CABLE catalog signature is $($sig.Status)" }
          if ($sig.SignerCertificate.Thumbprint -ne $thumbprint) {
            throw "VB-CABLE catalog is signed by $($sig.SignerCertificate.Thumbprint), expected $thumbprint"
          }
          $sig.SignerCertificate | Export-Certificate -FilePath "$dir.cer" | Out-Null
          Import-Certificate -FilePath "$dir.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $setup = Start-Process "$dir/VBCABLE_Setup_x64.exe" -ArgumentList '-i', '-h' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "VB-CABLE setup exited with $($setup.ExitCode)" }
          # Desktop programs are refused any microphone until this is allowed.
          foreach ($root in 'HKLM:', 'HKCU:') {
            $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Force "$key\NonPackaged" | Out-Null
            Set-ItemProperty $key Value Allow
            Set-ItemProperty "$key\NonPackaged" Value Allow
          }
          $devices = ffmpeg -hide_banner -list_devices true -f dshow -i dummy 2>&1 | Out-String
          if (-not $devices.Contains('CABLE Output')) { throw "VB-CABLE did not install:`n$devices" }
          exit 0
      - name: Fetch MediaMTX and build Softcam
        # Kept out of the cached target folder, so every run fetches and checks it again.
        run: ./scripts/livecheck-tools.ps1 -Into "$env:RUNNER_TEMP/livecheck-tools"
      - run: cargo build
      - name: Live check, many times
        run: |
          $failed = 0
          foreach ($i in 1..30) {
            $dir = "target/livecheck-$i"
            New-Item -ItemType Directory -Force $dir | Out-Null
            $env:LIVECRAFT_SOUND_TRACE = "$dir/trace.txt"
            $out = ./target/debug/livecraft.exe --livecheck $dir | Out-String
            $code = $LASTEXITCODE
            Write-Host "run $i ($code) -> $out"
            $out | Out-File "$dir/result.txt"
            Remove-Item "$dir/*.pcm" -ErrorAction SilentlyContinue
            if ($code -ne 0) { $failed++ } else { Remove-Item "$dir/*.gray" -ErrorAction SilentlyContinue }
          }
          Write-Host "$failed of 30 runs failed"
          if ($failed -gt 0) { exit 1 }
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: livecheck-many
          path: target/livecheck-*/
